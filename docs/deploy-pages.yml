name: Publicar Frontend en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Compilar build de producción con Vite
        env:
          # Configura el secret o variable VITE_API_URL en Settings -> Secrets and variables -> Actions de tu repositorio en GitHub
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://tu-backend-externo.com/api' }}
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
        run: npm run build

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

